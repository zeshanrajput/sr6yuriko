name: Redirect to Unified Monorepo

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy-redirect:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Create Redirect Payload
        run: |
          mkdir -p _site
          cat << 'EOF' > _site/index.html
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta http-equiv="refresh" content="0; url=https://zeshanrajput.github.io/sr6-core/characters/yuriko/" />
            <link rel="canonical" href="https://zeshanrajput.github.io/sr6-core/characters/yuriko/" />
            <title>Redirecting to Unified Portfolio</title>
            <style>
              body {
                background-color: #06080e;
                color: #e2e8f0;
                font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                height: 100vh;
                margin: 0;
                text-align: center;
              }
              a {
                color: #00f0ff;
                font-weight: 700;
                text-decoration: none;
              }
              a:hover {
                text-decoration: underline;
              }
            </style>
          </head>
          <body>
            <h2>Repository Consolidated</h2>
            <p>The Yuriko Star portfolio has moved to the unified SR6 ecosystem.</p>
            <p>Redirecting you to <a href="https://zeshanrajput.github.io/sr6-core/characters/yuriko/">https://zeshanrajput.github.io/sr6-core/characters/yuriko/</a>...</p>
          </body>
          </html>
          EOF

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
