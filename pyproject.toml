[project]
name = "sr6sheet"
version = "0.1.0"
description = "Shadowrun 6e Character Portfolio & Story Anthology — Yuriko Star"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "python-dotenv",
    "google-genai",
    "jupyter>=1.1.1",
    "ipykernel>=7.3.0",
    "pyyaml>=6.0.3",
    "lameenc",
    "numpy<2.5",
    "torch",
    "torchaudio",
    "kokoro",
    "soundfile",
    "mutagen>=1.47.0",
    "python-fasthtml>=0.14.11",
    "sr6-core",
]

[tool.uv.sources]
sr6-core = { path = "../sr6-core", editable = true }
torch = { index = "pytorch-cu124" }
torchaudio = { index = "pytorch-cu124" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
